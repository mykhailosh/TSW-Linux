# /etc/asound.conf - TSW-1060 (mainline): all ALSA programs (aplay etc.) go through PulseAudio
pcm.!default { type pulse }
ctl.!default { type pulse }

# straight to the hardware, bypassing PulseAudio (only while PulseAudio is stopped): aplay -D tsw48 ...
pcm.tsw48 {
    type plug
    slave { pcm "hw:0,0" rate 48000 format S16_LE channels 2 }
}
defaults.pcm.rate_converter "speexrate_medium"
